# Knowledge Distillation configuration: FLAN-T5-large (Teacher) -> FLAN-T5-base (Student)
teacher:
  name_or_path: "google/flan-t5-large"

student:
  name_or_path: "google/flan-t5-base"
  tokenizer_name: "google/flan-t5-base"
  max_input_length: 512
  max_target_length: 128

distillation:
  temperature: 2.0
  alpha: 0.6

data:
  train_path: "data/processed/train.csv"
  val_path: "data/processed/val.csv"

training:
  output_dir: "./models/flan_t5_distilled_large_to_base"
  learning_rate: 3.0e-5
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 2
  num_train_epochs: 3
  max_steps: -1
  weight_decay: 0.01
  logging_steps: 20
  eval_steps: 100
  save_steps: 100
  save_total_limit: 3
  seed: 42

