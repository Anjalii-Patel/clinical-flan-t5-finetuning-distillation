# Knowledge Distillation configuration: FLAN-T5-XL (Teacher) -> FLAN-T5-large (Student)
teacher:
  name_or_path: "google/flan-t5-xl"

student:
  name_or_path: "google/flan-t5-large"
  tokenizer_name: "google/flan-t5-large"
  max_input_length: 512
  max_target_length: 128

distillation:
  temperature: 2.0
  alpha: 0.5  # Weight of soft KL loss vs hard CE loss

data:
  train_path: "data/processed/train.csv"
  val_path: "data/processed/val.csv"

training:
  output_dir: "./models/flan_t5_distilled_xl_to_large"
  learning_rate: 2.0e-5
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  num_train_epochs: 3
  max_steps: -1
  weight_decay: 0.01
  logging_steps: 50
  eval_steps: 100
  save_steps: 100
  save_total_limit: 3
  seed: 42

